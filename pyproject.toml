[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tools"
version = "0.1.0"
description = "A collection of utility tools for LLMs and automation"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
audio = ["openai>=1.0.0"]
image = ["Pillow>=10.0.0"]
text = ["nltk>=3.8", "textstat>=0.7.0"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "flake8>=6.0.0"]
all = ["openai>=1.0.0", "Pillow>=10.0.0", "nltk>=3.8", "textstat>=0.7.0"]

[project.scripts]
tools = "tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src" 